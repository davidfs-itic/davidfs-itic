site_name: Documentació DavidFS - ITIC
site_url: https://davidfs-itic.github.io/davidfs-itic
site_dir: ./site
site_author: David F
plugins:
    - search
    - awesome-pages
markdown_extensions:
  - admonition
  - attr_list             # Atributs als elements (botons, mida d'icones)
  - md_in_html            # Markdown dins d'HTML (grid cards de la portada)
  - pymdownx.emoji:       # Icones del tema (Material, Simple Icons, Octicons)
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details      # For collapsible admonitions
  - pymdownx.superfences:  # For nested content
      custom_fences:        # Diagrames Mermaid amb blocs ```mermaid
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 3
#https://github.com/christo-ph/mkdocs_build_plantuml      
# Tema
theme:
  name: material
  language: ca
  #locale: ca
  palette:
      - scheme: default
        primary: teal
        accent: indigo
        toggle:
            icon: material/toggle-switch-off-outline
            name: Canviar a mode fosc
      - scheme: slate
        primary: teal
        accent: indigo
        toggle:
            icon: material/toggle-switch
            name: Canviar a mode clar
  features:
  - navigation.instant
  - navigation.expand
  - navigation.tabs
#  - navigation.sections
#  - navigation.path
#  - search.suggest
#  //El toc.integrate està de moment desactivat perquè fa que no es vegi el toc a la dreta de la pàgina
#  - toc.integrate

extra_css:
  - stylesheets/extra.css

